<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>Introduction to Next-Generation Wireless Networks｜網路導航所</title><style>
:root{--ink:#172b3a;--muted:#617687;--paper:#f3f7f8;--blue:#176b87;--pale:#e5f2f4;--line:#dce5e9;--green:#24765e;--red:#a64843}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.72 "Times New Roman","標楷體",KaiTi,serif}button,input{font:inherit}button{cursor:pointer}.top{background:#102a43;color:white;padding:14px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between}.brand{font-weight:bold;letter-spacing:.05em}.brand span{color:#a9dce5}.top small{color:#d3e1e8}.layout{max-width:1120px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:250px 1fr;gap:22px}.side,.panel{background:white;border:1px solid var(--line);border-radius:15px;box-shadow:0 12px 32px #15364c10}.side{padding:18px;height:max-content;position:sticky;top:16px}.side h2{font-size:19px;margin:0 0 10px}.ptext{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.progress{height:8px;background:#edf2f4;border-radius:10px;margin:8px 0 15px;overflow:hidden}.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--blue),#42a18a);transition:.2s}.nav{display:grid;gap:4px}.nav button{text-align:left;border:0;border-radius:8px;background:transparent;padding:8px;color:#506577;font-size:15px;display:flex;gap:9px;align-items:center}.nav button:hover{background:#f2f7f8}.nav button.active{background:var(--pale);color:#104d63;font-weight:bold}.nav button.done .num{background:#d9efe5;color:var(--green)}.num{width:26px;height:26px;border-radius:50%;background:#edf2f4;display:grid;place-items:center;flex:none}.panel{padding:clamp(22px,4vw,40px);min-height:550px}.eyebrow{font-size:13px;letter-spacing:.12em;color:var(--blue);font-weight:bold;margin:0 0 9px}.panel h1{font-size:clamp(28px,4vw,40px);line-height:1.3;margin:0 0 12px}.lead{font-size:19px;color:#536a7a}.tag{display:inline-block;background:#edf5f6;color:#24596d;padding:3px 10px;border-radius:30px;font-size:14px;margin:2px 4px 2px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:20px 0}.card{border:1px solid var(--line);border-radius:11px;padding:16px;background:#fff}.card h3{font-size:19px;margin:0 0 6px}.card p{margin:0}.callout{padding:15px 18px;background:#f0f7f8;border-left:4px solid var(--blue);border-radius:8px;margin:20px 0}.diagram{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding:18px;margin:20px 0;background:#f7fafb;border:1px solid var(--line);border-radius:12px}.node{padding:9px 13px;border:1px solid #b6d0d8;border-radius:9px;background:white;text-align:center}.arrow{color:var(--blue);font-size:22px}.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:9px}.steps li{counter-increment:s;display:flex;gap:11px;padding:11px;background:#f7fafb;border-radius:9px}.steps li:before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--blue);color:white;text-align:center;line-height:26px;flex:none}.prompt{font-weight:bold;margin:17px 0 8px}.choices{display:grid;gap:8px}.choice{border:1px solid var(--line);border-radius:9px;padding:11px 14px;background:white;text-align:left;color:var(--ink)}.choice:hover{border-color:var(--blue);background:#f5fbfc}.choice.correct{background:#e9f6ef;border-color:#67aa8d}.choice.wrong{background:#fff0ef;border-color:#cf817c}.feedback{min-height:28px;color:var(--muted);margin:9px 0}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.actions{display:flex;justify-content:space-between;margin-top:22px;gap:10px}.btn{border:0;border-radius:9px;padding:10px 16px;background:var(--blue);color:white;font-weight:bold}.btn.secondary{background:#edf3f5;color:#294859}.btn:disabled{opacity:.45}.certificate{border:7px double #c99b42;padding:clamp(20px,4vw,42px);text-align:center;background:linear-gradient(135deg,#fffefa,#f7f8f4);margin-top:22px}.seal{font-size:34px;color:#b5862b}.certificate h2{font-size:30px;color:#163b50}.certificate input{width:min(400px,100%);padding:11px;border:1px solid #b7c6cc;border-radius:8px}.cert-name{font-size:31px;color:#176b87;border-bottom:1px solid #b8a16d;display:inline-block;min-width:220px;margin:15px 0}.cert-meta{color:#596b73}.footer{max-width:1120px;margin:auto;padding:0 18px 22px;text-align:center;color:var(--muted);font-size:14px}@media(max-width:780px){.layout{grid-template-columns:1fr;margin-top:14px}.side{position:static;padding:13px}.nav{display:flex;overflow:auto}.nav button{flex:none}.nav button span:last-child{display:none}.nav button .num{width:30px;height:30px}.grid{grid-template-columns:1fr}.top{padding:12px 16px}}@media print{body{background:#fff}.top,.side,.footer,.panel>.eyebrow,.panel>h1,.panel>.lead,.panel>.tags,.panel>.actions,.certificate input,.certificate-actions,.panel>.callout{display:none!important}.layout{display:block;margin:0;padding:0}.panel{border:0;box-shadow:none;padding:0}.certificate{min-height:92vh;margin:0;border:8px double #a77d2e;display:flex;flex-direction:column;justify-content:center;break-inside:avoid}.certificate h2{font-size:34pt}.cert-name{font-size:28pt}.cert-meta{font-size:14pt}}
</style></head><body><header class="top"><div class="brand">◉ 網路導航所 <span>／學習任務</span></div><small>從一台手機出發，認識網路如何連結世界</small></header><div class="layout"><aside class="side"><h2>你的學習路線</h2><div class="ptext"><span>單元進度</span><span id="progressLabel">0 / 10</span></div><div class="progress"><i id="progressBar"></i></div><nav id="nav" class="nav"></nav></aside><main><article class="panel" id="panel"></article></main></div><footer class="footer">網路導航所 · 依據《次世代無線網路概論筆記》整理 · 進度保存在此裝置</footer><script>
const units=[
{title:'無線網路的基本地圖',lead:'無線網路把裝置接上網路，但訊號共享空氣，也會受距離、障礙與干擾影響。先認識基本角色。',tags:['Wireless','Mobility','BSS／Cell'],body:`<div class="grid"><section class="card"><h3>無線傳輸 Wireless</h3><p>資料透過無線電訊號傳遞。距離衰減、牆面遮蔽、反射與其他訊號都可能影響品質。</p></section><section class="card"><h3>移動性 Mobility</h3><p>裝置移動時，網路需要維持連線，並在適當時機把服務交給另一個基地台。</p></section><section class="card"><h3>基地台與核心網路</h3><p>基地台服務附近裝置；核心網路處理更廣域的路由、驗證與服務連結。</p></section><section class="card"><h3>小區與頻道</h3><p>BSS／cell 是無線區域的基本服務範圍。妥善分配頻道能降低干擾、善用頻寬。</p></section></div><p><b>兩種連線模式：</b>Infrastructure mode 透過基地台連線；ad hoc mode 讓裝置彼此接力傳送，不必經過基地台。</p><div class="callout"><b>生活連結：</b>教室裡 Wi-Fi 變慢，可能是共享頻道競爭、訊號衰減或干擾，不一定是網路線故障。</div>${quiz('無線訊號容易受到哪些因素影響？',['只有手機電量','距離、牆面與其他訊號','網頁網址長度'],1,'距離、遮蔽物、反射與干擾都可能改變無線品質。')}`},
{title:'手機如何加入 Wi-Fi',lead:'裝置連上 Wi-Fi 前會尋找網路、選擇基地台、完成驗證，並取得網路設定。',tags:['掃描','驗證','DHCP','CSMA/CA'],body:`<ol class="steps"><li>掃描可用頻道與 AP，選擇合適的無線基地台。</li><li>依網路設定完成身分驗證與關聯。</li><li>使用 DHCP 取得 IP 位址等網路設定，開始通訊。</li></ol><p><b>CDMA：</b>使用者以不同的碼序列編碼資料，接收端用對應碼序列解碼。</p><h3>共享頻道：先聽再傳</h3><p>Wi-Fi 的 CSMA/CA 在傳送前先感測頻道，忙碌時等待後再試；接收端回 ACK。RTS／CTS 可在特定情境協調傳輸機會，降低隱藏節點碰撞。</p><div class="diagram"><span class="node">掃描 AP</span><b class="arrow">→</b><span class="node">驗證／關聯</span><b class="arrow">→</b><span class="node">DHCP 取得 IP</span><b class="arrow">→</b><span class="node">開始通訊</span></div>${quiz('新加入 Wi-Fi 後，通常由哪個服務提供 IP 設定？',['DNS','ARP','DHCP'],2,'DHCP 提供 IP 位址與相關網路設定。')}`},
{title:'近距離、4G 與 5G',lead:'不同無線技術服務不同範圍。Bluetooth 適合個人裝置，行動網路則支援廣域移動連線。',tags:['Bluetooth','LTE','5G NR','MIMO'],body:`<div class="grid"><section class="card"><h3>Bluetooth</h3><p>常用於耳機、鍵盤等短距離個人裝置連線。</p></section><section class="card"><h3>4G／LTE</h3><p>透過基地台與核心網路提供廣域行動服務，支援換手與身分管理。</p></section><section class="card"><h3>5G 設計目標</h3><p>提高峰值速率、降低延遲並擴大容量；實際成效依部署與環境而異。</p></section><section class="card"><h3>頻段與天線</h3><p>5G NR 包括 FR1 與較高頻的 FR2。高頻可提供較大頻寬，但覆蓋受距離與遮蔽影響。MIMO 使用多天線改善容量或可靠性。</p></section></div><div class="callout"><b>應用思考：</b>高頻可能帶來高速傳輸，但牆面和距離也會影響覆蓋，因此基地台部署需配合場域。</div><p><b>省電與同步：</b>無線節點可依 beacon 時間醒來；LTE 手機也會在活動後進入較淺或較深的睡眠狀態。</p>${quiz('手機連接無線耳機最常使用哪一種技術？',['Bluetooth','LTE handover','IPsec'],0,'Bluetooth 常見於短距離個人裝置連線。')}`},
{title:'移動中如何維持連線',lead:'行動網路需要管理用戶身分、位置與資料路徑，讓手機跨基地台移動時盡量不中斷。',tags:['Home／Visited','Handover','Routing'],body:`<div class="diagram"><span class="node">手機<br>基地台</span><b class="arrow">↔</b><span class="node">行動管理<br>身分與位置</span><b class="arrow">↔</b><span class="node">資料閘道<br>外部網路</span></div><div class="grid"><section class="card"><h3>Home 與 visited network</h3><p>Home network 保存訂閱資訊；使用者到其他網路時，visited network 協助提供連線並與 home network 協作。</p></section><section class="card"><h3>Handover 換手</h3><p>裝置移動到新基地台時，網路協調資源並重新配置連線，以降低服務中斷。</p></section><section class="card"><h3>間接路由</h3><p>經由家鄉代理轉送，方便追蹤位置，但路徑可能繞遠。</p></section><section class="card"><h3>直接路由</h3><p>傳送方直接連到目的端，路徑較短，但需要掌握更新後的位置。</p></section></div>${quiz('手機移動到另一基地台並轉移服務，稱為什麼？',['Hashing','Handover','Flooding'],1,'Handover（換手）是移動時轉移服務基地台的程序。')}`},
{title:'網路安全：保密、驗證、完整',lead:'安全不只是藏起訊息，也要能確認對方身分、偵測內容變動，並讓服務持續可用。',tags:['Confidentiality','Authentication','Integrity','Availability'],body:`<div class="grid"><section class="card"><h3>保密性</h3><p>未授權者無法讀懂資料，常透過加密達成。</p></section><section class="card"><h3>身分驗證</h3><p>確認連線對象或訊息來源，降低假冒風險。</p></section><section class="card"><h3>完整性</h3><p>偵測資料是否遭未授權修改，常使用雜湊或訊息驗證碼。</p></section><section class="card"><h3>可用性</h3><p>讓合法使用者需要時能取得服務，並防範拒絕服務攻擊。</p></section></div><p><b>對稱式加密</b>：共享同一祕密金鑰加解密，適合大量資料。<br><b>非對稱式加密</b>：公鑰與私鑰配對，可協助交換金鑰、驗證身分或簽章。</p><div class="callout"><b>記憶方式：</b>用收件者公鑰加密的資料，預期由對應私鑰解開；簽章則由簽署者私鑰產生，公鑰驗證。</div>${quiz('要讓只有收件者能讀取訊息，通常用哪把鑰匙加密？',['收件者的公鑰','寄件者的公鑰','任意人的私鑰'],0,'收件者的公鑰可用來加密，對應私鑰負責解密。')}`},
{title:'雜湊、簽章與憑證',lead:'雜湊摘要協助檢查內容，數位簽章表明簽署來源，憑證則把公鑰與身分連結起來。',tags:['Hash','Digital signature','CA','Nonce'],body:`<ol class="steps"><li>雜湊函數將任意長度資料轉成固定長度摘要；它不是加密，不能還原原文。</li><li>數位簽章由簽署者的私鑰產生，驗證者用對應公鑰檢查簽章與內容。</li><li>憑證機構 CA 簽發憑證，協助確認公鑰與網站或個人身分的關聯。</li><li>Nonce 是一次性或有時效的隨機值，可降低舊訊息重播被冒用的風險。</li></ol><div class="callout"><b>辨析：</b>一般校驗和可發現部分錯誤，但不等於密碼學完整性保護；雜湊也需要選用適當的安全演算法。</div>${quiz('網站憑證的重要用途之一是什麼？',['加寬 Wi-Fi 頻道','分配 IP','驗證網站身分與公鑰關聯'],2,'CA 簽發憑證，協助驗證網站身分與公鑰的關聯。')}`},
{title:'TLS：安全瀏覽網站',lead:'HTTPS 使用 TLS 協助瀏覽器與伺服器建立信任，再保護後續資料傳輸。',tags:['Handshake','Session key','Integrity','Replay'],body:`<div class="diagram"><span class="node">協商版本與算法</span><b class="arrow">→</b><span class="node">驗證伺服器憑證</span><b class="arrow">→</b><span class="node">衍生工作金鑰</span><b class="arrow">→</b><span class="node">安全傳輸</span></div><p>TLS 握手協商安全參數並驗證身分，接著衍生工作金鑰，以效率較高的對稱式密碼保護大量資料。完整性保護可協助偵測資料遭竄改。</p><div class="grid"><section class="card"><h3>重播與重排</h3><p>序號與驗證標記等機制可協助偵測重播或順序改變。</p></section><section class="card"><h3>0-RTT</h3><p>恢復連線可減少等待，但早期資料可能有重播風險；避免用於會產生重複副作用的操作。</p></section></div>${quiz('TLS 通常用什麼方式保護大量應用資料？',['每個位元都用公鑰','協商出的對稱式工作金鑰','只靠 IP 位址'],1,'握手後使用效率較高的對稱式工作金鑰保護資料。')}`},
{title:'IPsec 與 Wi-Fi 防護',lead:'不同網路層能提供不同防護。IPsec 保護 IP 封包，Wi-Fi 安全機制處理無線接入與驗證。',tags:['IPsec','AH／ESP','Tunnel','EAP'],body:`<div class="grid"><section class="card"><h3>Transport mode</h3><p>保護 IP 封包的資料部分，保留原 IP 標頭以利路由。</p></section><section class="card"><h3>Tunnel mode</h3><p>保護整個原始封包，再加上新的外層標頭，常用於 VPN 網路互連。</p></section><section class="card"><h3>AH 與 ESP</h3><p>AH 著重來源驗證與完整性；ESP 可提供加密及完整性保護。</p></section><section class="card"><h3>SA 與安全政策</h3><p>SA 保存安全通道參數；SPD 決定封包採取的安全政策。</p></section></div><p>EAP 可支援行動裝置與驗證伺服器之間的驗證流程；行動網路也會以訂閱身分與核心網路協作。</p>${quiz('企業網路間建立 VPN 通道，常見的 IPsec 模式是？',['Transport mode','Tunnel mode','Promiscuous mode'],1,'Tunnel mode 將原始封包封裝於新的 IP 封包中。')}`},
{title:'鏈結層：錯誤偵測與共享通道',lead:'每一段鏈路都可能有自己的傳輸方式。鏈結層負責相鄰節點間的傳送，並協調多台裝置如何共享媒介。',tags:['Link layer','CRC','ALOHA','CSMA'],body:`<div class="grid"><section class="card"><h3>鏈結層做什麼</h3><p>網卡或晶片實作鏈結層，在相鄰節點間傳送 frame，可提供錯誤偵測、錯誤更正、流量控制與半雙工／全雙工服務。</p></section><section class="card"><h3>偵測傳輸錯誤</h3><p>同位元檢查加入檢查位元；CRC 以雙方共享的產生式檢查資料與檢查位元，接收端餘數非零就表示可能出錯。</p></section><section class="card"><h3>分割與輪流</h3><p>TDMA 切時間、FDMA 切頻帶，固定分配簡單但空閒時可能浪費資源。Polling 由主控端詢問，Token passing 由持有權杖的節點傳送。</p></section><section class="card"><h3>隨機存取</h3><p>ALOHA 允許碰撞後等待再傳；Slotted ALOHA 需同步，理想效率上限約 37%，Pure ALOHA 約 18%。CSMA 先聽再傳，碰撞時以隨機退避重試。</p></section></div><div class="callout"><b>生活連結：</b>多人同時使用無線頻道，就像多人共用一條走道；分時、排隊或先聽再走，都是管理共享資源的方法。</div>${quiz('CRC 檢查後餘數非零，代表什麼？',['封包可能在傳輸中出錯','已找到目的 IP','已完成身分驗證'],0,'CRC 是鏈結層常用的錯誤偵測方法。')}`},
{title:'乙太網路、交換器與 VLAN',lead:'在區域網路裡，ARP 尋找 MAC 位址，交換器學習裝置所在的埠；VLAN 則把同一實體網路切成隔離的邏輯網路。',tags:['ARP','Ethernet','Switch','VLAN'],body:`<div class="grid"><section class="card"><h3>ARP 找 MAC</h3><p>裝置先查 IP–MAC 快取；查無時在區域網路廣播詢問，目標裝置回覆 MAC。紀錄會附上 TTL，到期後更新。</p></section><section class="card"><h3>乙太網路 frame</h3><p>乙太網路是常見 LAN 技術。它不需先建立連線，也不保證送達；接收端依 MAC 位址判斷是否接收。</p></section><section class="card"><h3>交換器自我學習</h3><p>交換器記住來源 MAC 與進入埠的對應。已知目的埠就單播轉送；未知目的 MAC 會泛洪到其他埠。</p></section><section class="card"><h3>VLAN 隔離</h3><p>依埠分組建立邏輯區隔，減少單一廣播網域過大帶來的負擔。跨交換器的 VLAN frame 可用 802.1Q 標記 VLAN ID。</p></section></div><div class="callout"><b>交換器 vs. 路由器：</b>交換器主要看 MAC 位址，在鏈結層轉送；路由器看 IP 位址，在網路層連接不同網路。</div>${quiz('交換器通常根據哪個位址學習並轉送區域網路 frame？',['MAC 位址','DNS 名稱','TCP 埠號'],0,'交換器學習來源 MAC 與進入埠，再依目的 MAC 決定轉送。')}`},
{title:'防火牆與網頁封包旅程',lead:'把安全防護和各層網路元件串起來：從規則檢查到 DNS、路由器與伺服器，看看一次瀏覽如何完成。',tags:['Firewall／IDS','Routing／Forwarding','DNS','DHCP'],body:`<div class="grid"><section class="card"><h3>防火牆</h3><p>依存取控制規則過濾流量。無狀態過濾逐封包檢查；有狀態過濾也追蹤連線狀態；應用閘道可依應用層資料過濾。</p></section><section class="card"><h3>IDS 與 DMZ</h3><p>IDS 分析封包內容與跨封包行為，例如掃描或拒絕服務跡象。對外伺服器可放在 DMZ，與內部網路隔離。</p></section><section class="card"><h3>Routing 與 Forwarding</h3><p>Routing 決定封包應走的路徑；forwarding 是路由器依轉送表將封包從輸入埠送到輸出埠。佇列壅塞會帶來延遲或丟包。</p></section><section class="card"><h3>資料中心</h3><p>多層交換器與多條路徑協助承載負載並提高可靠性；負載平衡器可將用戶請求分配到合適的伺服器。</p></section></div><h3>打開網頁時的資料旅程</h3><ol class="steps"><li>DHCP 提供裝置 IP 與閘道設定。</li><li>DNS 將網站名稱解析為 IP；ARP 找到第一跳閘道的 MAC。</li><li>交換器在區域網路轉送 frame，路由器逐跳把 IP 封包送往目的地。</li><li>TCP 建立連線並傳輸 HTTP 資料，伺服器回覆後瀏覽器呈現網頁。</li></ol><div class="callout"><b>完成挑戰：</b>輸入姓名製作課程完成證明，可使用列印功能另存 PDF。</div><section class="certificate"><div class="certificate-intro"><div class="seal">✦</div><p class="eyebrow">網路導航所 · 學習完成證明</p><h2>次世代無線網路概論</h2><p>恭喜完成本課程互動學習路線</p><input id="nameInput" maxlength="40" placeholder="請輸入姓名" aria-label="請輸入姓名"><div class="certificate-actions" style="margin-top:12px"><button class="btn" id="makeCert">製作我的證明</button> <button class="btn secondary" id="printCert" disabled>列印／另存 PDF</button></div></div><div class="cert-name" id="certName">學習者</div><p class="cert-meta">已完成課程：<b>次世代無線網路概論</b></p><p class="cert-meta">學習平台：網路導航所　｜　完成日期：<span id="certDate"></span></p><p class="cert-meta">本證明記錄互動課程完成，不代表正式學分或專業資格。</p></section>`}
];
function quiz(q,opts,answer,why){return `<p class="prompt">快問快答：${q}</p><div class="choices" data-answer="${answer}" data-why="${why}">${opts.map(x=>`<button class="choice">${x}</button>`).join('')}</div><div class="feedback"></div>`}
const nav=document.querySelector('#nav'),panel=document.querySelector('#panel');let current=0,done=JSON.parse(localStorage.getItem('inwn-progress-v2')||'[]');function update(){document.querySelector('#progressLabel').textContent=`${done.length} / ${units.length}`;document.querySelector('#progressBar').style.width=`${done.length/units.length*100}%`}
function renderNav(){nav.innerHTML=units.map((u,i)=>`<button data-i="${i}" class="${current===i?'active ':''}${done.includes(i)?'done':''}"><span class="num">${done.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span>${u.title}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function mark(){if(!done.includes(current)){done.push(current);localStorage.setItem('inwn-progress-v2',JSON.stringify(done));renderNav();update()}}
function go(i){current=(i+units.length)%units.length;let u=units[current];panel.innerHTML=`<p class="eyebrow">單元 ${String(current+1).padStart(2,'0')} / ${units.length}</p><h1>${u.title}</h1><p class="lead">${u.lead}</p><div class="tags">${u.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>${u.body}<div class="actions"><button class="btn secondary" id="prev" ${current===0?'disabled':''}>← 上一單元</button><button class="btn" id="next">${current===units.length-1?'回到第一單元':'下一單元 →'}</button></div>`;document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);panel.querySelectorAll('.choices').forEach(g=>g.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{if(g.dataset.locked)return;g.dataset.locked='1';let ok=i===+g.dataset.answer;b.classList.add(ok?'correct':'wrong');if(!ok)g.children[+g.dataset.answer].classList.add('correct');let f=g.nextElementSibling;f.textContent=(ok?'答對了！':'再看一次觀念。')+g.dataset.why;f.className='feedback '+(ok?'good':'bad');mark()}));if(current===units.length-1)certificate();renderNav();update();window.scrollTo({top:0,behavior:'smooth'})}
function certificate(){document.querySelector('#certDate').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Taipei'}).format(new Date());document.querySelector('#makeCert').onclick=()=>{let n=document.querySelector('#nameInput').value.trim();if(!n){document.querySelector('#nameInput').focus();return}document.querySelector('#certName').textContent=n;document.querySelector('#printCert').disabled=false;mark()};document.querySelector('#printCert').onclick=()=>window.print()}
renderNav();go(0);
</script></body></html>
