;color:var(--blue);font-weight:bold;margin-bottom:10px}.panel h1{font-size:clamp(28px,4vw,42px);margin-bottom:14px}.lead{font-size:19px;color:#536a7a;max-width:760px}.tag{display:inline-block;background:#edf5f6;color:#24596d;padding:3px 10px;border-radius:99px;font-size:14px;margin:2px 4px 2px 0}.callout{padding:17px 20px;background:#f0f7f8;border-left:4px solid var(--blue);border-radius:8px;margin:22px 0}.callout strong{color:#145b72}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px 0}.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:18px}.card h3{font-size:19px;margin-bottom:7px}.card p:last-child{margin:0}.diagram{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:21px;margin:22px 0;background:#f7fafb;border:1px solid var(--line);border-radius:12px}.node{padding:10px 15px;border:1px solid #b6d0d8;border-radius:10px;background:#fff;text-align:center}.arrow{color:var(--blue);font-weight:bold;font-size:22px}.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:10px}.steps li{counter-increment:s;display:flex;gap:12px;padding:13px;background:#f7fafb;border-radius:10px}.steps li:before{content:counter(s);flex:none;width:27px;height:27px;border-radius:50%;background:var(--blue);color:#fff;text-align:center;line-height:27px;font-size:15px}.prompt{font-weight:bold;margin-bottom:12px}.choices{display:grid;gap:9px}.choice{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px;text-align:left;color:var(--ink)}.choice:hover{border-color:var(--blue);background:#f5fbfc}.choice.correct{border-color:#67aa8d;background:#e9f6ef}.choice.wrong{border-color:#cf817c;background:#fff0ef}.feedback{min-height:28px;margin:12px 0;color:var(--muted)}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.reveal{border:0;background:none;color:var(--blue);text-decoration:underline;padding:5px 0}.answer{display:none;background:#f7fafb;border-radius:10px;padding:14px 16px;margin-top:10px}.answer.show{display:block}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:22px}.btn{border:0;border-radius:9px;padding:11px 18px;background:var(--blue);color:#fff;font-weight:bold}.btn:hover{background:#10556f}.btn.secondary{background:#edf3f5;color:#294859}.btn:disabled{opacity:.45;cursor:not-allowed}.certificate{border:7px double #c99b42;padding:clamp(22px,5vw,48px);text-align:center;background:linear-gradient(135deg,#fffefa,#f7f8f4);margin-top:24px}.certificate .seal{font-size:36px;color:#b5862b}.certificate h2{font-size:30px;color:#163b50}.certificate input{width:min(420px,100%);padding:12px;border:1px solid #b7c6cc;border-radius:8px;background:#fff}.cert-name{font-size:32px;color:#176b87;border-bottom:1px solid #b8a16d;display:inline-block;min-width:220px;margin:16px 0}.cert-meta{color:#596b73}.certificate-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.foot{max-width:1160px;margin:0 auto;padding:0 20px 24px;text-align:center;color:var(--muted);font-size:14px}.hidden{display:none!important}.mobile-head{display:none}

<header class="top"><div class="brand">◉ 網路導航所 <span>／學習任務</span></div><small>從一台手機出發，認識網路如何連結世界</small></header>
<div class="layout"><aside class="side"><h2>你的學習路線</h2><div class="progress-text"><span>單元進度</span><span id="progressLabel">0 / 12</span></div><div class="progress"><i id="progressBar"></i></div><nav class="nav" id="nav"></nav></aside><main class="content"><article class="panel" id="panel"></article></main></div>

<script>
const modules=[
{title:'從無線訊號開始',kicker:'單元 01 · 無線基礎',lead:'無線網路不是「沒有網路線的網際網路」而已。它要在共享的空氣中傳資料，也要照顧正在移動的裝置。',tags:['Wireless 無線傳輸','Mobility 移動性','基地台與核心網路'],body:`<div class="grid2"><section class="card"><h3>無線傳輸</h3><p>資料透過無線電訊號傳送。距離、牆面遮蔽、反射與其他訊號干擾，都會影響品質。</p></section><section class="card"><h3>移動性</h3><p>裝置走動時，網路要維持連線，並在適當時機把連線交給另一個基地台。</p></section><section class="card"><h3>基地台與核心</h3><p>基地台提供附近裝置無線接取；核心網路負責更廣域的路由、驗證與服務連結。</p></section><section class="card"><h3>小區與頻道</h3><p>無線區域常以 BSS／cell 描述。有限的頻譜要規劃頻道，降低同頻干擾並善用容量。</p></section></div><div class="callout"><strong>生活連結：</strong>同一間教室人多時 Wi-Fi 變慢，可能是共享頻道競爭、訊號衰減或干擾所致，不一定是「網路線斷了」。</div><p class="prompt">快問快答：無線訊號遇到什麼情況可能變弱或不穩？</p><div class="choices" data-answer="1" data-explain="距離增加、牆面遮蔽、反射與其他無線訊號都可能影響訊號品質。"><button class="choice">只有裝置電量不足</button><button class="choice">距離、障礙物與其他訊號干擾</button><button class="choice">只要換成不同網址就會變差</button></div><div class="feedback"></div>`},
{title:'裝置怎麼加入網路',kicker:'單元 02 · WLAN 與媒介存取',lead:'手機連上 Wi-Fi，背後有一段尋找網路、確認身分與取得網路設定的流程。',tags:['掃描與關聯','DHCP','CSMA/CA','RTS／CTS'],body:`<ol class="steps"><li>裝置掃描可用頻道與基地台，選擇合適的 AP。</li><li>依網路設定完成身分驗證與關聯。</li><li>透過 DHCP 取得 IP 位址等網路設定，開始傳送資料。</li></ol><h3>共享頻道：先聽再說</h3><p>Wi-Fi 常用 CSMA/CA 思路：送資料前先聽頻道，忙碌時等待並再試；接收端回 ACK。RTS／CTS 可在適用情境先協調傳送機會，減少隱藏節點造成的碰撞。</p><div class="diagram"><div class="node">裝置掃描</div><span class="arrow">→</span><div class="node">選擇 AP<br>驗證／關聯</div><span class="arrow">→</span><div class="node">DHCP 取得 IP</div><span class="arrow">→</span><div class="node">網路通訊</div></div><div class="callout"><strong>注意：</strong>筆記中的 DIFS、SIFS、ACK 描述的是無線媒介存取的等待與確認概念；有線乙太網路的碰撞處理方式則不同。</div><p class="prompt">情境：你在咖啡店加入 Wi-Fi 後，接著通常需要哪個服務取得 IP 設定？</p><div class="choices" data-answer="2" data-explain="DHCP 會提供 IP 位址與相關網路設定。"><button class="choice">DNS</button><button class="choice">ARP</button><button class="choice">DHCP</button></div><div class="feedback"></div>`},
{title:'小網路與蜂巢式網路',kicker:'單元 03 · Bluetooth、4G 與 5G',lead:'不同無線技術服務的範圍與目標不同：耳機重視近距離連線，行動網路則支援廣域移動。',tags:['Bluetooth','4G LTE','5G NR','MIMO'],body:`<div class="grid2"><section class="card"><h3>Bluetooth</h3><p>常用於短距離個人裝置連線，例如耳機、鍵盤與手機。裝置會探索並建立彼此連線。</p></section><section class="card"><h3>4G／LTE</h3><p>以基地台與核心網路提供廣域行動連線，並支援裝置移動時的換手與身分管理。</p></section><section class="card"><h3>5G 的設計目標</h3><p>提升峰值速率、降低延遲並擴大容量；實際效能依頻段、部署與環境而異。</p></section><section class="card"><h3>頻段與天線</h3><p>5G NR 包含較低頻的 FR1 與較高頻的 FR2。較高頻可能有更大頻寬，但傳播距離與穿透能力也受環境影響。MIMO 使用多天線改善容量或可靠性。</p></section></div><div class="callout"><strong>生活連結：</strong>高頻訊號可支援高速傳輸，但遮蔽與距離會影響覆蓋，因此基地台部署需要配合場域。</div><p class="prompt">哪個情境最適合用 Bluetooth？</p><div class="choices" data-answer="0" data-explain="Bluetooth 常見於耳機等短距離個人裝置連線。"><button class="choice">手機連接無線耳機</button><button class="choice">跨城市基地台提供行動網路</button><button class="choice">路由器決定跨國封包路徑</button></div><div class="feedback"></div>`},
{title:'行動時如何不斷線',kicker:'單元 04 · 行動管理與換手',lead:'行動裝置會移動，網路必須知道怎麼找到它、如何確認身分，以及如何把資料送到新的連線位置。',tags:['Home／Visited network','Handover','Indirect／Direct routing'],body:`<div class="diagram"><div class="node">手機<br>目前基地台</div><span class="arrow">↔</span><div class="node">行動管理<br>身分與位置</div><span class="arrow">↔</span><div class="node">資料閘道<br>外部網路</div></div><div class="grid2"><section class="card"><h3>Home 與 visited network</h3><p>Home network 保存用戶訂閱與身分相關資訊；使用者到其他網路時，由 visited network 協助提供連線並與 home network 協作。</p></section><section class="card"><h3>Serving／PDN gateway</h3><p>閘道協助承載資料與連接外部網路；行動管理功能協助認證、追蹤位置與配置資料通道。</p></section><section class="card"><h3>換手 handover</h3><p>裝置移動到新基地台時，網路協調來源與目標基地台、檢查資源並重新配置連線，目標是降低中斷。</p></section><section class="card"><h3>Indirect 與 direct routing</h3><p>間接路由可經由家鄉代理轉送，便於追蹤位置但路徑可能繞遠；直接路由較短，但傳送方需要更新目的裝置位置。</p></section></div><p class="prompt">搭車通話時手機換到下一個基地台，這個連線轉移稱為什麼？</p><div class="choices" data-answer="1" data-explain="Handover（換手）是在移動時轉移服務基地台的程序。"><button class="choice">Hashing</button><button class="choice">Handover</button><button class="choice">Flooding</button></div><div class="feedback"></div>`},
{title:'網路安全的三把鎖',kicker:'單元 05 · 加密與驗證',lead:'安全不只是「把內容藏起來」。還要確認對方身分，並能察覺訊息是否被改動。',tags:['Confidentiality','Authentication','Integrity','Public／Private key'],body:`<div class="grid2"><section class="card"><h3>保密性 Confidentiality</h3><p>未授權者無法讀懂資料，常以加密達成。</p></section><section class="card"><h3>身分驗證 Authentication</h3><p>確認連線對象或訊息來源，降低假冒風險。</p></section><section class="card"><h3>完整性 Integrity</h3><p>偵測傳輸內容是否遭到未授權修改，常使用雜湊或訊息驗證碼。</p></section><section class="card"><h3>可用性 Availability</h3><p>讓合法使用者在需要時能取得服務，並防範拒絕服務等攻擊。</p></section></div><p><strong>對稱式加密：</strong>雙方使用共享祕密金鑰加解密，速度通常適合大量資料。<br><strong>非對稱式加密：</strong>使用公鑰與私鑰配對，可協助安全交換金鑰、驗證身分或產生簽章。</p><div class="callout"><strong>生活比喻：</strong>公鑰像人人可用的上鎖信箱投入口；私鑰像只有收件者持有的開箱鑰匙。數位簽章的私鑰用途是簽署，公鑰則用來驗證簽章。</div><p class="prompt">若要讓只有收件者能讀訊息，通常用哪一把鑰匙加密給收件者？</p><div class="choices" data-answer="0" data-explain="用收件者的公鑰加密，預期由對應的私鑰解密。"><button class="choice">收件者的公鑰</button><button class="choice">寄件者的公鑰</button><button class="choice">任何人的私鑰</button></div><div class="feedback"></div>`},
{title:'雜湊、簽章與憑證',kicker:'單元 06 · 建立信任',lead:'加密保護內容，雜湊提供固定長度的摘要，數位簽章與憑證則協助建立來源信任。',tags:['Hash','Digital signature','CA','Nonce'],body:`<ol class="steps"><li>雜湊函數把任意長度資料轉成固定長度摘要，用於比對內容是否改變；雜湊本身不是加密，也不能還原原文。</li><li>數位簽章由簽署者以私鑰簽署訊息摘要，驗證者使用對應公鑰檢查簽章與內容。</li><li>憑證機構 CA 對「身分與公鑰的關聯」簽發憑證；瀏覽器可驗證憑證鏈，降低冒用公鑰風險。</li><li>Nonce 是一次性或時效性的隨機值，可放入驗證流程，以降低重播舊訊息的風險。</li></ol><div class="callout"><strong>辨析：</strong>校驗和可以發現部分傳輸錯誤，但不等同密碼學完整性保護；雜湊也可能有不同輸入得到相同摘要的碰撞，因此需使用合適的安全機制。</div><p class="prompt">網站憑證最重要的用途之一是什麼？</p><div class="choices" data-answer="2" data-explain="CA 簽發憑證，協助驗證網站身分與其公鑰的關聯。"><button class="choice">讓 Wi-Fi 頻道變寬</button><button class="choice">替資料自動分配 IP</button><button class="choice">協助確認網站身分與公鑰的關聯</button></div><div class="feedback"></div>`},
{title:'TLS：安全地逛網站',kicker:'單元 07 · TLS 與安全連線',lead:'瀏覽器開啟 HTTPS 網站時，TLS 協助雙方協商安全參數、驗證伺服器，並保護後續資料。',tags:['Handshake','Session keys','MAC／AEAD','Replay'],body:`<div class="diagram"><div class="node">協商版本與演算法</div><span class="arrow">→</span><div class="node">驗證伺服器憑證<br>協商祕密</div><span class="arrow">→</span><div class="node">衍生工作金鑰</div><span class="arrow">→</span><div class="node">加密傳輸</div></div><p>TLS 使用公鑰密碼學與憑證等機制建立信任，再衍生工作金鑰，用對稱式密碼保護大量資料。每個資料記錄也需要完整性保護；現代 TLS 常使用 AEAD 等同時提供加密與驗證的方式。</p><div class="grid2"><section class="card"><h3>為什麼分開金鑰用途？</h3><p>不同用途採用合適的金鑰材料，減少單一金鑰跨用途使用造成的風險。</p></section><section class="card"><h3>重播與截斷</h3><p>序號、驗證標記、連線結束訊號等機制可協助偵測重排、重播或異常截斷。</p></section></div><div class="callout"><strong>0-RTT 提醒：</strong>恢復連線時可減少等待，但早期資料可能有重播風險，應避免用於會造成重複副作用的操作。</div><p class="prompt">TLS 通常用什麼方式保護大量應用資料？</p><div class="choices" data-answer="1" data-explain="握手建立共用工作金鑰後，通常使用效率較高的對稱式密碼保護資料。"><button class="choice">每個位元都用公鑰加密</button><button class="choice">使用協商出的對稱式工作金鑰</button><button class="choice">只用 IP 位址隱藏資料</button></div><div class="feedback"></div>`},
{title:'IPsec 與 Wi-Fi 防護',kicker:'單元 08 · 網路層與無線驗證',lead:'安全可以放在不同網路層處理。IPsec 保護 IP 封包；Wi-Fi 安全機制則處理無線接入與驗證。',tags:['IPsec','AH／ESP','Transport／Tunnel','EAP'],body:`<div class="grid2"><section class="card"><h3>Transport mode</h3><p>保護 IP 封包的資料部分，保留原始 IP 標頭可供路由。</p></section><section class="card"><h3>Tunnel mode</h3><p>保護整個原始 IP 封包，再加上新的外層標頭，常用於網路間的 VPN 通道。</p></section><section class="card"><h3>AH 與 ESP</h3><p>AH 著重來源驗證與完整性；ESP 可提供加密與完整性保護，是常見的 IPsec 協定。</p></section><section class="card"><h3>SA、SPD 與 SAD</h3><p>安全關聯 SA 儲存通道參數；SPD 決定封包的安全政策，SAD 保存套用政策所需的關聯資訊。</p></section></div><p>Wi-Fi 連線也要協商安全設定並完成身分驗證。EAP 可支援行動裝置與驗證伺服器之間的驗證流程；4G／5G 行動網路則使用 SIM／訂閱身分與核心網路協作。</p><p class="prompt">企業兩個網路要透過 VPN 安全互連，較常見的 IPsec 模式是？</p><div class="choices" data-answer="1" data-explain="Tunnel mode 會把原始封包封裝在新的 IP 封包內，適合網路間通道。"><button class="choice">Transport mode</button><button class="choice">Tunnel mode</button><button class="choice">Promiscuous mode</button></div><div class="feedback"></div>`},
{title:'防火牆與入侵偵測',kicker:'單元 09 · 網路邊界與監測',lead:'防火牆依規則控制流量，入侵偵測系統則觀察封包與行為線索。兩者互補，沒有單一工具能解決所有風險。',tags:['Firewall','ACL','IDS','DMZ'],body:`<div class="grid2"><section class="card"><h3>無狀態封包過濾</h3><p>逐封包檢查來源、目的、協定與埠等欄位，不追蹤連線狀態。</p></section><section class="card"><h3>有狀態封包過濾</h3><p>記錄連線狀態，只允許符合既有狀態與政策的回應流量。</p></section><section class="card"><h3>應用層閘道</h3><p>能依應用協定內容套用更細緻的規則，但需處理特定應用流量。</p></section><section class="card"><h3>IDS 與 DMZ</h3><p>IDS 分析封包特徵與行為關聯；對外服務可放在隔離的 DMZ，降低內部網路暴露。</p></section></div><div class="callout"><strong>威脅辨識：</strong>IP spoofing 竄改來源位址；DoS 企圖耗盡服務資源；竊聽、假冒與連線劫持則分別威脅機密性、身分與連線控制。</div><p class="prompt">觀察多個封包的關聯以發現掃描或 DoS 行為，較符合哪一種工具？</p><div class="choices" data-answer="2" data-explain="IDS 能分析封包內容與跨封包行為關聯。"><button class="choice">DHCP</button><button class="choice">ARP</button><button class="choice">IDS</button></div><div class="feedback"></div>`},
{title:'鏈結層：每一跳的品質',kicker:'單元 10 · 錯誤偵測與媒介存取',lead:'資料在網路中逐段通過不同媒介。鏈結層處理相鄰節點間的傳送，檢查錯誤並協調共享媒介。',tags:['Parity','CRC','TDMA／FDMA','ALOHA／CSMA'],body:`<div class="grid2"><section class="card"><h3>錯誤偵測</h3><p>同位元檢查簡單但能力有限；二維同位元可定位部分錯誤。CRC 以多項式除法餘數偵測常見傳輸錯誤。</p></section><section class="card"><h3>頻道分割</h3><p>TDMA 分配時槽，FDMA 分配頻帶。人少時固定分配可能浪費閒置資源。</p></section><section class="card"><h3>隨機存取</h3><p>ALOHA 與 CSMA 允許競爭傳送，碰撞時依規則等待並重傳。CSMA 傳送前先感測頻道。</p></section><section class="card"><h3>輪流傳送</h3><p>Polling 由控制者依序詢問；Token passing 由持有權杖的節點取得傳送機會。</p></section></div><div class="callout"><strong>為什麼逐跳與端到端都要檢查？</strong>逐跳錯誤偵測可早點發現鏈路問題；端到端檢查則確保資料抵達最終目的地時仍正確。</div><p class="prompt">CRC 的主要用途是什麼？</p><div class="choices" data-answer="0" data-explain="CRC 是鏈結層常見的錯誤偵測方法。"><button class="choice">偵測傳輸錯誤</button><button class="choice">決定網站網域名稱</button><button class="choice">替使用者建立公私鑰</button></div><div class="feedback"></div>`},
{title:'MAC、ARP 與乙太網路',kicker:'單元 11 · 區域網路如何送達',lead:'IP 位址指出網路層目的地；在區域網路中，鏈結層還需要知道下一跳的 MAC 位址。',tags:['IP／MAC','ARP','Ethernet','Switch／VLAN'],body:`<ol class="steps"><li>主機查看 ARP 快取，尋找目標 IP 或預設閘道的 MAC 對應。</li><li>若沒有記錄，主機在區域網路廣播 ARP 詢問；對應主機或閘道回覆自己的 MAC。</li><li>乙太網路 frame 以目的 MAC 導向下一跳；交換器學習來源 MAC 與進入埠的對應。</li><li>交換器查表轉送；未知目的 MAC 時會在適當範圍內泛洪，並依 VLAN 隔離廣播網域。</li></ol><div class="grid2"><section class="card"><h3>交換器與路由器</h3><p>交換器主要依 MAC 位址在鏈結層轉送；路由器依 IP 路由資訊在網路層轉送。</p></section><section class="card"><h3>VLAN 與 Trunk</h3><p>VLAN 可用邏輯方式分隔廣播網域；802.1Q 標籤攜帶 VLAN ID，讓多個 VLAN 可經由 trunk 連結傳送。</p></section></div><p class="prompt">同一個 LAN 裡，交換器主要看哪個位址決定 frame 轉送埠？</p><div class="choices" data-answer="1" data-explain="交換器依目的 MAC 位址查詢 forwarding table。"><button class="choice">DNS 名稱</button><button class="choice">目的 MAC 位址</button><button class="choice">TLS 憑證序號</button></div><div class="feedback"></div>`},
{title:'路由器與資料旅程',kicker:'單元 12 · 網路層與完成證明',lead:'從點下網頁連結到收到內容，資料需要經過名稱解析、區域網路轉送、路由與可靠傳輸。完成最後的小挑戰，就能製作你的學習證明。',tags:['DHCP／DNS','Forwarding／Routing','Buffer／Queue','證明書'],body:`<h3>一個網頁請求的旅程</h3><ol class="steps"><li>裝置先透過 DHCP 取得 IP 與閘道等設定。</li><li>查詢 DNS 將網站名稱解析成 IP；封裝資料並透過 ARP 找到第一跳閘道的 MAC。</li><li>路由器依路由與轉送表，逐跳把封包送向目的地；交換器在區域網路內轉送 frame。</li><li>TCP 可建立連線並提供可靠、有序的資料流；伺服器回覆後，瀏覽器呈現頁面。</li></ol><div class="grid2"><section class="card"><h3>Routing 與 Forwarding</h3><p>Routing 決定路徑；forwarding 在單台路由器內，依封包標頭選擇輸出埠。</p></section><section class="card"><h3>排隊與壅塞</h3><p>封包抵達速度長時間高於轉送或鏈路速度，會造成佇列延遲與丟棄。排程決定佇列中哪個封包先走。</p></section></div><div class="callout"><strong>你已經走完網路旅程！</strong>輸入姓名製作證明，使用「列印／另存 PDF」即可保存。</div><div class="certificate" id="certificate"><div class="certificate-intro"><div class="seal">✦</div><p class="eyebrow">網路導航所 · 學習完成證明</p><h2>次世代無線網路概論</h2><p>恭喜完成本課程互動學習路線</p><input id="nameInput" maxlength="40" placeholder="請輸入姓名" aria-label="請輸入姓名"><div class="certificate-actions" style="margin-top:14px"><button class="btn" id="makeCert">製作我的證明</button><button class="btn secondary" id="printCert" disabled>列印／另存 PDF</button></div></div><div class="cert-name" id="certName">學習者</div><p class="cert-meta">已完成課程：<strong>次世代無線網路概論</strong></p><p class="cert-meta">學習平台：網路導航所　｜　完成日期：<span id="certDate"></span></p><p class="cert-meta">本證明記錄互動式課程學習完成，不代表正式學分或專業資格。</p></div>`}
];
const nav=document.querySelector('#nav'),panel=document.querySelector('#panel');let current=0;let completed=JSON.parse(localStorage.getItem('netnav-done')||'[]');
function renderNav(){nav.innerHTML=modules.map((m,i)=>`<button class="${i===current?'active ':''}${completed.includes(i)?'done':''}" data-i="${i}"><span class="num">${completed.includes(i)?'✓':String(i+1).padStart(2,'0')}</span><span>${m.title}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i))}
function go(i){current=Math.max(0,Math.min(modules.length-1,i));const m=modules[current];panel.innerHTML=`<div class="eyebrow">${m.kicker}</div><h1>${m.title}</h1><p class="lead">${m.lead}</p><div>${m.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>${m.body}<div class="actions"><button class="btn secondary" id="prev" ${current===0?'disabled':''}>← 上一單元</button><button class="btn" id="next">${current===modules.length-1?'回到第一單元':'下一單元 →'}</button></div>`;document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current===modules.length-1?0:current+1);wireChoices();if(current===modules.length-1)wireCert();renderNav();updateProgress();window.scrollTo({top:0,behavior:'smooth'})}
function markDone(){if(!completed.includes(current)){completed.push(current);localStorage.setItem('netnav-done',JSON.stringify(completed));renderNav();updateProgress()}}
function wireChoices(){panel.querySelectorAll('.choices').forEach(group=>{const fb=group.nextElementSibling;group.querySelectorAll('.choice').forEach((b,i)=>b.onclick=()=>{if(group.dataset.locked)return;group.dataset.locked='1';const ok=i===+group.dataset.answer;b.classList.add(ok?'correct':'wrong');if(!ok)group.children[+group.dataset.answer].classList.add('correct');fb.textContent=(ok?'答對了！':'再看一次觀念。')+group.dataset.explain;fb.className='feedback '+(ok?'good':'bad');markDone()})})}
function updateProgress(){document.querySelector('#progressLabel').textContent=`${completed.length} / ${modules.length}`;document.querySelector('#progressBar').style.width=`${completed.length/modules.length*100}%`}
function wireCert(){document.querySelector('#certDate').textContent=new Intl.DateTimeFormat('zh-TW',{year:'numeric',month:'long',day:'numeric',timeZone:'Asia/Taipei'}).format(new Date());document.querySelector('#makeCert').onclick=()=>{const name=document.querySelector('#nameInput').value.trim();if(!name){document.querySelector('#nameInput').focus();return}document.querySelector('#certName').textContent=name;document.querySelector('#printCert').disabled=false;markDone()};document.querySelector('#printCert').onclick=()=>window.print()}
renderNav();go(0);
</script></body></html>
